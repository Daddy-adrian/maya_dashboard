<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PHONIX — English Phonics Learning Hub</title>
  <link rel="stylesheet" href="./css/phonix.css">
</head>
<body>
  <a href="#main-content" class="skip-link visually-hidden">Skip to main content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">Aa</span>
        <div class="brand__text">
          <span class="brand__name">PHONIX</span>
          <span class="brand__tagline">Short-Vowel &amp; CVC Reading Lab</span>
        </div>
      </div>
      <div class="vowel-legend" aria-label="Short vowel color key">
        <span class="vowel-badge vowel-badge--a" title="Short a">a</span>
        <span class="vowel-badge vowel-badge--e" title="Short e">e</span>
        <span class="vowel-badge vowel-badge--i" title="Short i">i</span>
        <span class="vowel-badge vowel-badge--o" title="Short o">o</span>
        <span class="vowel-badge vowel-badge--u" title="Short u">u</span>
        <span class="vowel-badge vowel-badge--joker" title="Gold Joker">★</span>
      </div>
    </div>
  </header>

  <main id="main-content" class="app-main">
    <div id="app-root" class="app-container">
      <div class="loading-state" role="status">
        <p>Loading PHONIX learning modules…</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>PHONIX English Phonics Program &bull; Stories 1–28 &amp; CVC Arcade</p>
    </div>
  </footer>

  <div id="app-announcer" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
